services:
    web:
        build:
            context: .
            dockerfile: ./apps/web/docker/production/Dockerfile
            args:
                VITE_APP_NAME: '${VITE_APP_NAME}'
                VITE_PUSHER_APP_KEY: '${PUSHER_APP_KEY}'
                VITE_PUSHER_HOST: '${SOKETI_DOMAIN}'
                VITE_PUSHER_PORT: 443
                VITE_PUSHER_SCHEME: https
        image: ghcr.io/freepeace13/equalsite-web:latest
        restart: always
        stop_grace_period: 30s
        env_file: .env
        networks:
            - equalsite
        depends_on:
            - mysql
            - redis
            - soketi
        mem_limit: 512m
        cpus: 1.0
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost/up']
            interval: 30s
            timeout: 5s
            retries: 3

    horizon:
        image: ghcr.io/freepeace13/equalsite-web:latest
        command: php artisan horizon
        restart: always
        # Horizon needs time to finish in-flight jobs after SIGTERM; 10s default got it SIGKILLed mid-drain.
        stop_grace_period: 60s
        env_file: .env
        networks:
            - equalsite
        depends_on:
            - mysql
            - redis
        mem_limit: 512m
        cpus: 1.0

    crawler-listen:
        image: ghcr.io/freepeace13/equalsite-web:latest
        command: php artisan spider:listen
        restart: always
        stop_grace_period: 30s
        env_file: .env
        networks:
            - equalsite
        depends_on:
            - redis
        mem_limit: 256m
        cpus: 0.5

    crawler-api:
        build:
            context: .
            dockerfile: ./services/playwright-spider/Dockerfile
            target: production
        image: ghcr.io/freepeace13/equalsite-crawler:latest
        command: node dist/server.js
        restart: always
        environment:
            NODE_ENV: production
            STREAM_NAME: '${STREAM_NAME:-equalsite:crawler:events}'
            CRAWLER_SECRET: '${CRAWLER_SECRET}'
            CRAWLER_PORT: '${CRAWLER_PORT:-3000}'
            REDIS_HOST: '${REDIS_HOST:-redis}'
            REDIS_PORT: '${REDIS_PORT:-6379}'
            SENTRY_DSN: '${SENTRY_DSN}'
            SENTRY_ENVIRONMENT: '${SENTRY_ENVIRONMENT:-production}'
        volumes:
            - 'crawler-storage:/app/services/playwright-spider/storage'
        depends_on:
            - redis
        networks:
            - equalsite
        mem_limit: 512m
        cpus: 0.5
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'curl -sf -H "Authorization: Bearer $$CRAWLER_SECRET" http://localhost:3000/api/v1/ping || exit 1',
                ]
            interval: 30s
            timeout: 5s
            retries: 3

    crawler-worker:
        build:
            context: .
            dockerfile: ./services/playwright-spider/Dockerfile
            target: production
        image: ghcr.io/freepeace13/equalsite-crawler:latest
        command: node dist/worker.js
        restart: always
        environment:
            NODE_ENV: production
            STREAM_NAME: '${STREAM_NAME:-equalsite:crawler:events}'
            CRAWLER_SECRET: '${CRAWLER_SECRET}'
            CRAWLER_PORT: '${CRAWLER_PORT:-3000}'
            REDIS_HOST: '${REDIS_HOST:-redis}'
            REDIS_PORT: '${REDIS_PORT:-6379}'
            SENTRY_DSN: '${SENTRY_DSN}'
            SENTRY_ENVIRONMENT: '${SENTRY_ENVIRONMENT:-production}'
        volumes:
            - 'crawler-storage:/app/services/playwright-spider/storage'
        depends_on:
            - redis
        networks:
            - equalsite
        mem_limit: 2500m
        cpus: 2.0

    # Infra images are pinned by digest: a floating tag re-resolving during a deploy's
    # `compose pull && up -d` recreates the container mid-deploy, breaking DNS for the
    # service name while old app containers are still draining (Sentry getaddrinfo burst,
    # 2026-07-26). To upgrade, update the tag AND digest together, deliberately.
    mysql:
        image: 'mysql:8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6'
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'mysql-data:/var/lib/mysql'
        networks:
            - equalsite
        mem_limit: 1500m
        cpus: 1.5
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD}']
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:8.8.1-alpine@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb'
        restart: always
        volumes:
            - 'redis-data:/data'
        networks:
            - equalsite
        mem_limit: 512m
        cpus: 0.5
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 3
            timeout: 5s

    soketi:
        image: 'quay.io/soketi/soketi:latest-16-alpine@sha256:fe7e68cdec157343b40cdbe604dd3ca2788d3fbf5624d3ab8f085b623d700ece'
        restart: always
        environment:
            SOKETI_DEBUG: '0'
            SOKETI_METRICS_SERVER_PORT: '9601'
            SOKETI_DEFAULT_APP_ID: '${PUSHER_APP_ID}'
            SOKETI_DEFAULT_APP_KEY: '${PUSHER_APP_KEY}'
            SOKETI_DEFAULT_APP_SECRET: '${PUSHER_APP_SECRET}'
            SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: 'true'
            SOKETI_DEFAULT_APP_ENABLE_STATS: 'false'
        networks:
            - equalsite
        mem_limit: 256m
        cpus: 0.5

    caddy:
        image: 'caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648'
        restart: always
        environment:
            APP_DOMAIN: '${APP_DOMAIN}'
            SOKETI_DOMAIN: '${SOKETI_DOMAIN}'
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - './Caddyfile:/etc/caddy/Caddyfile'
            - 'caddy-data:/data'
            - 'caddy-config:/config'
        depends_on:
            - web
            - soketi
        networks:
            - equalsite
        mem_limit: 128m
        cpus: 0.5

networks:
    equalsite:
        driver: bridge

volumes:
    mysql-data:
        driver: local
    redis-data:
        driver: local
    caddy-data:
        driver: local
    caddy-config:
        driver: local
    crawler-storage:
        driver: local
