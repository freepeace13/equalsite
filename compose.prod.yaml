services:
    web:
        build:
            context: .
            dockerfile: ./apps/web/docker/production/Dockerfile
            args:
                VITE_APP_NAME: '${VITE_APP_NAME}'
                VITE_PUSHER_APP_KEY: '${PUSHER_APP_KEY}'
                VITE_PUSHER_HOST: '${SOKETI_DOMAIN}'
                VITE_PUSHER_PORT: 443
                VITE_PUSHER_SCHEME: https
        image: equalsite-web:production
        restart: always
        env_file: .env
        networks:
            - equalsite
        depends_on:
            - mysql
            - redis
            - soketi
        mem_limit: 512m
        cpus: 1.0
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost/up']
            interval: 30s
            timeout: 5s
            retries: 3

    horizon:
        image: equalsite-web:production
        command: php artisan horizon
        restart: always
        env_file: .env
        networks:
            - equalsite
        depends_on:
            - mysql
            - redis
        mem_limit: 512m
        cpus: 1.0

    crawler-listen:
        image: equalsite-web:production
        command: php artisan spider:listen
        restart: always
        env_file: .env
        networks:
            - equalsite
        depends_on:
            - redis
        mem_limit: 256m
        cpus: 0.5

    crawler-api:
        build:
            context: .
            dockerfile: ./services/playwright-spider/Dockerfile
            target: production
        image: equalsite-crawler:production
        command: node dist/server.js
        restart: always
        environment:
            NODE_ENV: production
            STREAM_NAME: '${STREAM_NAME:-equalsite:crawler:events}'
            CRAWLER_SECRET: '${CRAWLER_SECRET}'
            CRAWLER_PORT: '${CRAWLER_PORT:-3000}'
            REDIS_HOST: '${REDIS_HOST:-redis}'
            REDIS_PORT: '${REDIS_PORT:-6379}'
        volumes:
            - 'crawler-storage:/app/services/playwright-spider/storage'
        depends_on:
            - redis
        networks:
            - equalsite
        mem_limit: 512m
        cpus: 0.5
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'curl -sf -H "Authorization: Bearer $$CRAWLER_SECRET" http://localhost:3000/api/v1/ping || exit 1',
                ]
            interval: 30s
            timeout: 5s
            retries: 3

    crawler-worker:
        build:
            context: .
            dockerfile: ./services/playwright-spider/Dockerfile
            target: production
        image: equalsite-crawler:production
        command: node dist/worker.js
        restart: always
        environment:
            NODE_ENV: production
            STREAM_NAME: '${STREAM_NAME:-equalsite:crawler:events}'
            CRAWLER_SECRET: '${CRAWLER_SECRET}'
            CRAWLER_PORT: '${CRAWLER_PORT:-3000}'
            REDIS_HOST: '${REDIS_HOST:-redis}'
            REDIS_PORT: '${REDIS_PORT:-6379}'
        volumes:
            - 'crawler-storage:/app/services/playwright-spider/storage'
        depends_on:
            - redis
        networks:
            - equalsite
        mem_limit: 2500m
        cpus: 2.0

    mysql:
        image: 'mysql:8.4'
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'mysql-data:/var/lib/mysql'
        networks:
            - equalsite
        mem_limit: 1500m
        cpus: 1.5
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD}']
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:alpine'
        restart: always
        volumes:
            - 'redis-data:/data'
        networks:
            - equalsite
        mem_limit: 512m
        cpus: 0.5
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 3
            timeout: 5s

    soketi:
        image: 'quay.io/soketi/soketi:latest-16-alpine'
        restart: always
        environment:
            SOKETI_DEBUG: '0'
            SOKETI_METRICS_SERVER_PORT: '9601'
            SOKETI_DEFAULT_APP_ID: '${PUSHER_APP_ID}'
            SOKETI_DEFAULT_APP_KEY: '${PUSHER_APP_KEY}'
            SOKETI_DEFAULT_APP_SECRET: '${PUSHER_APP_SECRET}'
            SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: 'true'
            SOKETI_DEFAULT_APP_ENABLE_STATS: 'false'
        networks:
            - equalsite
        mem_limit: 256m
        cpus: 0.5

    caddy:
        image: caddy:alpine
        restart: always
        environment:
            APP_DOMAIN: '${APP_DOMAIN}'
            SOKETI_DOMAIN: '${SOKETI_DOMAIN}'
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - './Caddyfile:/etc/caddy/Caddyfile'
            - 'caddy-data:/data'
            - 'caddy-config:/config'
        depends_on:
            - web
            - soketi
        networks:
            - equalsite
        mem_limit: 128m
        cpus: 0.5

networks:
    equalsite:
        driver: bridge

volumes:
    mysql-data:
        driver: local
    redis-data:
        driver: local
    caddy-data:
        driver: local
    caddy-config:
        driver: local
    crawler-storage:
        driver: local
